# Theme per PRD §8: professional-but-approachable, not generic SaaS-blue.
# Primary terracotta, secondary olive/sage, cream background, warm charcoal
# text, golden amber warnings, warm ivory cards with soft borders.

[theme]
base = "light"

primaryColor = "#C2622D"            # Terracotta — CTA, accents
backgroundColor = "#FBF3E7"         # Cream
secondaryBackgroundColor = "#FFFDF8"  # Warm ivory (widget/card surfaces)
textColor = "#3A2E27"               # Warm charcoal
borderColor = "#E8DCC8"             # Soft ivory border
linkColor = "#C2622D"
baseRadius = "10px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true

# Palette (semantic status colors)
greenColor = "#7A8450"              # Olive/sage — success
greenBackgroundColor = "#EDF1E2"
greenTextColor = "#4E5A2F"
yellowColor = "#D9A441"             # Golden amber — flag/review
yellowBackgroundColor = "#FBF0D9"
yellowTextColor = "#8F6519"
orangeColor = "#C2622D"             # Terracotta accent
orangeBackgroundColor = "#F9E8DE"
orangeTextColor = "#9A4A1D"
redColor = "#B3452B"
redBackgroundColor = "#F9E6E0"
redTextColor = "#8F2E15"
grayColor = "#8A7A6B"

chartCategoricalColors = [
    "#C2622D", "#7A8450", "#D9A441", "#5A4A3A", "#B3452B", "#9B8F7B", "#6E8B74",
]

font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"